<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2046賽博方程</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        body {
            background-color: #030408;
            color: #00f0ff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.12) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
        }
        
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #080a12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transform-origin: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
        }

        #loader-screen.shatter {
            transform: scale(1.5) rotate(15deg);
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        .loader-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 25px;
            text-shadow: 0 0 15px #00f0ff;
            text-align: center;
            padding: 0 15px;
        }

        .mc-progress-container {
            width: 280px;
            max-width: 80vw;
            height: 22px;
            background: #111422;
            border: 3px solid #2a3b5c;
            padding: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0, 240, 255, 0.2);
            position: relative;
        }

        .mc-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0099ff, #00f0ff);
            box-shadow: 0 0 10px #00f0ff;
            transition: width 0.1s linear;
        }

        .mc-progress-text {
            margin-top: 15px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #a0aec0;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 900px;
            max-height: 500px;
            background: rgba(8, 10, 18, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1);
            overflow: hidden;
            border-radius: 0;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 901) and (min-height: 501px) {
            #game-container {
                border-radius: 12px;
                width: 900px;
                height: 500px;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            justify-content: space-between;
            padding: 15px;
            z-index: 5;
        }
        .hud-left {
            font-size: 14px;
            text-shadow: 0 0 10px #00f0ff;
            letter-spacing: 1px;
            line-height: 1.5;
        }
        .hud-left span {
            color: #ffffff;
            font-weight: 900;
        }
        .pause-btn {
            pointer-events: auto;
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            width: 44px;
            height: 44px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 5, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .overlay-screen h1 {
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-shadow: 0 0 25px #00f0ff;
            color: #fff;
            font-weight: 900;
        }
        .overlay-screen h2 {
            font-size: 30px;
            margin-bottom: 12px;
            letter-spacing: 3px;
            text-shadow: 0 0 25px #ff0055;
            color: #ff0055;
            font-weight: 900;
        }
        .overlay-screen p {
            font-size: 12px;
            margin-bottom: 25px;
            color: #a0aec0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .menu-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 36px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            margin: 6px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            backdrop-filter: blur(8px);
            letter-spacing: 2px;
            border-radius: 6px;
            pointer-events: auto;
        }
        .menu-btn:active {
            background: #00f0ff;
            color: #030408;
            transform: scale(0.96);
        }
        #pause-screen {
            display: none;
        }
        #gameover-screen {
            display: none;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            font-size: 10px;
            color: #718096;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 0 10px;
            max-width: 100%;
        }

        /* 手機專用虛擬控制按鈕列 */
        .mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            display: none;
            justify-content: space-between;
            padding: 0 20px 15px 20px;
            z-index: 6;
            pointer-events: none;
        }
        .mob-btn {
            pointer-events: auto;
            background: rgba(0, 240, 255, 0.15);
            border: 2px solid #00f0ff;
            color: #00f0ff;
            width: 110px;
            height: 60px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mob-btn:active, .mob-btn.active {
            background: #00f0ff;
            color: #030408;
            box-shadow: 0 0 25px #00f0ff;
        }
        #mob-dash-btn.active {
            background: #bd00ff;
            border-color: #bd00ff;
            color: #fff;
            box-shadow: 0 0 25px #bd00ff;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="loader-title">『2046賽博方程』加載中...</div>
        <div class="mc-progress-container">
            <div class="mc-progress-bar" id="mcBar"></div>
        </div>
        <div class="mc-progress-text" id="mcText">進度... 0%</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div class="ui-layer" id="hud-layer">
            <div class="hud-left">
                <div>分數 : <span id="scoreVal">0</span></div>
                <div>速度倍率 : <span id="speedVal">1.3</span>x</div>
            </div>
            <button class="pause-btn" id="pauseBtn" onclick="togglePause()" title="暫停">❚❚</button>
        </div>

        <!-- 手機專屬獨立操作按鈕列 -->
        <div class="mobile-controls" id="mobileControls">
            <button class="mob-btn" id="mob-jump-btn">跳躍</button>
            <button class="mob-btn" id="mob-dash-btn">平移 (長按)</button>
        </div>

        <div class="overlay-screen" id="start-screen">
            <h1>賽博方程</h1>
            <p>FR科技公司製作</p>
            <button class="menu-btn" onclick="startGame()">點擊開始遊戲</button>
            <div class="controls-hint">電腦：空白鍵跳躍，長按0.2~2秒平移 | 手機：使用下方專屬控制按鈕</div>
        </div>

        <div class="overlay-screen" id="pause-screen">
            <h1>系統暫停</h1>
            <p>SYSTEM PAUSED</p>
            <button class="menu-btn" onclick="togglePause()">繼續遊戲</button>
            <button class="menu-btn" onclick="confirmRestart()">重新開始</button>
        </div>

        <div class="overlay-screen" id="gameover-screen">
            <h2>系統完結</h2>
            <p>最終得分 : <span id="finalScoreVal">0</span></p>
            <button class="menu-btn" onclick="returnToStartScreen()">返回開始畫面</button>
        </div>
    </div>

    <script>
        let loadProgress = 0;
        const barElem = document.getElementById('mcBar');
        const textElem = document.getElementById('mcText');
        const loaderScreen = document.getElementById('loader-screen');
        const gameContainerBox = document.getElementById('game-container');
        const mobileControls = document.getElementById('mobileControls');

        // 偵測是否為行動裝置，決定是否顯示專屬虛擬按鈕
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

        let loadInterval = setInterval(() => {
            loadProgress += Math.floor(Math.random() * 15) + 8;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                barElem.style.width = '100%';
                textElem.innerText = 'Initializing... 100%';
                
                setTimeout(() => {
                    loaderScreen.classList.add('shatter');
                    setTimeout(() => loaderScreen.remove(), 600);
                }, 300);
            } else {
                barElem.style.width = loadProgress + '%';
                textElem.innerText = `Loading assets... ${loadProgress}%`;
            }
        }, 80);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'START';
        let score = 0;
        let gameSpeed = 8.0 * 1.3;
        let baseGravity = 1.45;

        let player = {
            x: 140,
            baseX: 140,
            y: 220,
            size: 38,
            vy: 0,
            gravity: baseGravity,
            jumpPower: -16.2,
            rotation: 0,
            targetRotation: 0,
            floorTimer: 0,
            ceilingTimer: 0,
            isDash: false
        };

        let pressTimer = null;
        let isHolding = false;
        let dashTimer = null;

        let obstacles = [];
        let particles = [];
        let backgroundLines = [];
        let frameCount = 0;

        for (let i = 0; i < 8; i++) {
            backgroundLines.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 60 + 30,
                speed: Math.random() * 2 + 1
            });
        }

        // 鍵盤控制 (電腦版)
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'PLAYING') {
                    if (!isHolding) {
                        isHolding = true;
                        jump();
                        pressTimer = setTimeout(() => {
                            if (isHolding) {
                                triggerDashState();
                            }
                        }, 200);
                    }
                } else if (gameState === 'START') {
                    startGame();
                }
            }
            if (e.code === 'Escape') {
                if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                    togglePause();
                }
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleRelease();
            }
        });

        // 桌面點擊畫布預設為單純跳躍，避免干擾
        canvas.addEventListener('mousedown', () => {
            if (!isMobile && gameState === 'PLAYING') {
                jump();
            }
        });

        // 手機專屬獨立按鈕事件綁定 (完美解決觸控手機版難以操作的問題)
        const mobJumpBtn = document.getElementById('mob-jump-btn');
        const mobDashBtn = document.getElementById('mob-dash-btn');

        if (mobJumpBtn) {
            mobJumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameState === 'PLAYING') {
                    jump();
                }
            });
            mobJumpBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (gameState === 'PLAYING') {
                    jump();
                }
            });
        }

        if (mobDashBtn) {
            const startDashTouch = (e) => {
                e.preventDefault();
                if (gameState === 'PLAYING' && !player.isDash) {
                    mobDashBtn.classList.add('active');
                    triggerDashState();
                }
            };
            const endDashTouch = (e) => {
                e.preventDefault();
                mobDashBtn.classList.remove('active');
                if (player.isDash) {
                    endDashState();
                }
            };

            mobDashBtn.addEventListener('touchstart', startDashTouch);
            mobDashBtn.addEventListener('touchend', endDashTouch);
            mobDashBtn.addEventListener('touchcancel', endDashTouch);
            mobDashBtn.addEventListener('mousedown', startDashTouch);
            mobDashBtn.addEventListener('mouseup', endDashTouch);
            mobDashBtn.addEventListener('mouseleave', endDashTouch);
        }

        function triggerDashState() {
            player.isDash = true;
            gameContainerBox.style.borderColor = '#bd00ff';
            gameContainerBox.style.boxShadow = '0 0 30px rgba(189, 0, 255, 0.5), inset 0 0 20px rgba(189, 0, 255, 0.2)';

            if (dashTimer) clearTimeout(dashTimer);
            dashTimer = setTimeout(() => {
                mobDashBtn.classList.remove('active');
                endDashState();
            }, 2000);
        }

        function endDashState() {
            player.isDash = false;
            if (dashTimer) {
                clearTimeout(dashTimer);
                dashTimer = null;
            }
            if (gameState === 'PLAYING') {
                gameContainerBox.style.borderColor = 'rgba(0, 240, 255, 0.5)';
                gameContainerBox.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1)';
            }
        }

        function handleRelease() {
            isHolding = false;
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            if (!isMobile && player.isDash) {
                endDashState();
            }
        }

        function jump() {
            if (player.isDash) return;

            player.vy = player.jumpPower;
            player.targetRotation -= Math.PI * 2;
            
            for(let i = 0; i < 4; i++) {
                particles.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    color: '#00f0ff',
                    size: Math.random() * 2.5 + 2,
                    life: 15
                });
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('hud-layer').style.display = 'flex';
            
            if (isMobile || window.innerWidth <= 800) {
                mobileControls.style.display = 'flex';
            }

            resetValues();
            requestAnimationFrame(loop);
        }

        function confirmRestart() {
            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                let check = confirm("遊戲正在進行中，確定要離開嗎？");
                if (!check) return;
            }
            returnToStartScreen();
        }

        function returnToStartScreen() {
            gameState = 'START';
            handleRelease();
            if (dashTimer) {
                clearTimeout(dashTimer);
                dashTimer = null;
            }
            document.getElementById('hud-layer').style.display = 'none';
            mobileControls.style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            resetValues();
            draw();
        }

        function resetValues() {
            score = 0;
            gameSpeed = 8.0 * 1.3;
            obstacles = [];
            particles = [];
            player.x = 140;
            player.y = 220;
            player.vy = 0;
            player.rotation = 0;
            player.targetRotation = 0;
            player.floorTimer = 0;
            player.ceilingTimer = 0;
            player.isDash = false;
            if (mobDashBtn) mobDashBtn.classList.remove('active');
            gameContainerBox.style.borderColor = 'rgba(0, 240, 255, 0.5)';
            gameContainerBox.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1)';
            frameCount = -70;
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('pause-screen').style.display = 'flex';
                handleRelease();
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('pause-screen').style.display = 'none';
                requestAnimationFrame(loop);
            }
        }

        function spawnObstacle() {
            const topBoundary = 50;
            const bottomBoundary = 450;
            const totalHeight = bottomBoundary - topBoundary;
            const obstacleWidth = 38;

            const type = Math.floor(Math.random() * 3);

            if (type === 0) {
                const h = Math.random() * 110 + 60;
                obstacles.push({
                    x: canvas.width,
                    y: bottomBoundary - h,
                    width: obstacleWidth,
                    height: h
                });
            } else if (type === 1) {
                const h = Math.random() * 110 + 60;
                obstacles.push({
                    x: canvas.width,
                    y: topBoundary,
                    width: obstacleWidth,
                    height: h
                });
            } else {
                const minGap = 160; 
                const maxTopH = totalHeight - minGap - 60;
                const topH = Math.random() * (maxTopH - 60) + 60;
                
                const gapY1 = topBoundary + topH;
                const gapY2 = gapY1 + minGap;
                const bottomH = bottomBoundary - gapY2;

                obstacles.push({
                    x: canvas.width,
                    y: topBoundary,
                    width: obstacleWidth,
                    height: topH
                });

                obstacles.push({
                    x: canvas.width,
                    y: gapY2,
                    width: obstacleWidth,
                    height: bottomH
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            score += Math.floor(gameSpeed / 4);

            document.getElementById('scoreVal').innerText = score;
            document.getElementById('speedVal').innerText = '1.3';

            const bottomLimit = 450 - player.size;

            if (player.isDash) {
                player.vy = 0;
            } else {
                player.vy += player.gravity;
                player.y += player.vy;
            }

            let targetX = player.baseX;
            if (player.isDash) {
                targetX = player.baseX + 120;
            }
            player.x += (targetX - player.x) * 0.4;

            player.rotation += (player.targetRotation - player.rotation) * 0.2;

            const topLimit = 50;

            if (player.y <= topLimit) {
                player.y = topLimit;
                player.vy = 0;
                player.ceilingTimer++;
                if (player.ceilingTimer > 30) {
                    triggerGameOver();
                    return;
                }
            } else {
                player.ceilingTimer = 0;
            }

            if (player.y >= bottomLimit) {
                player.y = bottomLimit;
                player.vy = 0;
                player.floorTimer++;
                if (player.floorTimer > 30) {
                    triggerGameOver();
                    return;
                }
            } else {
                player.floorTimer = 0;
            }

            backgroundLines.forEach(line => {
                line.x -= line.speed * (gameSpeed * 0.3);
                if (line.x < -100) {
                    line.x = canvas.width + 50;
                    line.y = Math.random() * canvas.height;
                }
            });

            if (frameCount >= 0 && frameCount % 4 === 0) {
                particles.push({
                    x: player.x,
                    y: player.y + player.size / 2,
                    vx: -gameSpeed * 0.4,
                    vy: (Math.random() - 0.5) * 1.2,
                    color: player.isDash ? 'rgba(189, 0, 255, 0.8)' : 'rgba(0, 240, 255, 0.7)',
                    size: Math.random() * 2 + 1,
                    life: 12
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            frameCount++;
            if (frameCount >= 0) {
                let spawnInterval = 75;
                if (frameCount % spawnInterval === 0) {
                    spawnObstacle();
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                let padding = 7;
                if (
                    player.x + padding < obstacles[i].x + obstacles[i].width - padding &&
                    player.x + player.size - padding > obstacles[i].x + padding &&
                    player.y + padding < obstacles[i].y + obstacles[i].height - padding &&
                    player.y + player.size - padding > obstacles[i].y + padding
                ) {
                    triggerGameOver();
                    return;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            handleRelease();
            if (dashTimer) {
                clearTimeout(dashTimer);
                dashTimer = null;
            }
            if (mobDashBtn) mobDashBtn.classList.remove('active');
            document.getElementById('hud-layer').style.display = 'none';
            mobileControls.style.display = 'none';
            document.getElementById('finalScoreVal').innerText = score;
            document.getElementById('gameover-screen').style.display = 'flex';
            
            gameContainerBox.style.borderColor = '#ff0055';
            gameContainerBox.style.boxShadow = '0 0 30px rgba(255, 0, 85, 0.5), inset 0 0 20px rgba(255, 0, 85, 0.2)';

            for(let i = 0; i < 12; i++) {
                particles.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: '#ff0055',
                    size: Math.random() * 3 + 2,
                    life: 20
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#060810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 1.5;
            backgroundLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x, line.y);
                ctx.lineTo(line.x + line.length, line.y);
                ctx.stroke();
            });

            let isTouchingFloor = (player.floorTimer > 0);
            let floorColor = isTouchingFloor ? '#ff0055' : '#00f0ff';
            if (isTouchingFloor) {
                gameContainerBox.style.borderColor = '#ff0055';
                gameContainerBox.style.boxShadow = '0 0 30px rgba(255, 0, 85, 0.4), inset 0 0 20px rgba(255, 0, 85, 0.2)';
            } else if (!player.isDash) {
                gameContainerBox.style.borderColor = 'rgba(0, 240, 255, 0.5)';
                gameContainerBox.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1)';
            }

            ctx.strokeStyle = floorColor;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 6;
            ctx.shadowColor = floorColor;
            
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.lineTo(canvas.width, 50);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 450);
            ctx.lineTo(canvas.width, 450);
            ctx.stroke();
            ctx.shadowBlur = 0;

            let topGradient = ctx.createLinearGradient(0, 0, 0, 50);
            topGradient.addColorStop(0, isTouchingFloor ? 'rgba(255, 0, 85, 0.3)' : 'rgba(0, 240, 255, 0.3)');
            topGradient.addColorStop(1, 'transparent');
            ctx.fillStyle = topGradient;
            ctx.fillRect(0, 0, canvas.width, 50);

            let bottomGradient = ctx.createLinearGradient(0, 450, 0, 500);
            bottomGradient.addColorStop(0, 'transparent');
            bottomGradient.addColorStop(1, isTouchingFloor ? 'rgba(255, 0, 85, 0.3)' : 'rgba(0, 240, 255, 0.3)');
            ctx.fillStyle = bottomGradient;
            ctx.fillRect(0, 450, canvas.width, 50);

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate(player.rotation);

            let maxTimer = Math.max(player.floorTimer, player.ceilingTimer);
            let redRatio = Math.min(maxTimer / 30, 1.0);

            let r = Math.floor(0 + redRatio * 255);
            let g = Math.floor(240 * (1 - redRatio));
            let b = Math.floor(255 * (1 - redRatio));
            
            if (player.isDash) {
                r = 189; g = 0; b = 255;
            }

            let dynamicColor = `rgb(${r}, ${g}, ${b})`;

            ctx.fillStyle = dynamicColor;
            ctx.shadowBlur = player.isDash ? 12 : 8;
            ctx.shadowColor = dynamicColor;
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-player.size / 4, -player.size / 4, player.size / 2, player.size / 2);

            ctx.restore();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            obstacles.forEach(obs => {
                ctx.shadowBlur = 5;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            if (gameState === 'PLAYING') {
                requestAnimationFrame(loop);
            } else if (gameState === 'GAMEOVER') {
                let particleAnimationCount = 0;
                function renderDeathAnim() {
                    if (gameState === 'GAMEOVER' && particleAnimationCount < 25) {
                        particleAnimationCount++;
                        for (let i = particles.length - 1; i >= 0; i--) {
                            let p = particles[i];
                            p.x += p.vx;
                            p.y += p.vy;
                            p.life--;
                            if (p.life <= 0) particles.splice(i, 1);
                        }
                        draw();
                        requestAnimationFrame(renderDeathAnim);
                    }
                }
                renderDeathAnim();
            }
        }

        draw();
    </script>
</body>
</html>
