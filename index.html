<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER DASH - 賽博幾何跑酷</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background-color: #030408;
            color: #00f0ff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.12) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
        }
        #game-container {
            position: relative;
            width: 900px;
            max-width: 100%;
            height: 500px;
            background: rgba(8, 10, 18, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3), inset 0 0 25px rgba(0, 240, 255, 0.15);
            overflow: hidden;
            border-radius: 12px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            justify-content: space-between;
            padding: 20px;
            z-index: 5;
        }
        .hud-left {
            font-size: 15px;
            text-shadow: 0 0 10px #00f0ff;
            letter-spacing: 1px;
            line-height: 1.5;
        }
        .hud-left span {
            color: #ffffff;
            font-weight: 900;
        }
        .pause-btn {
            pointer-events: auto;
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            width: 44px;
            height: 44px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pause-btn:hover {
            background: #00f0ff;
            color: #030408;
            box-shadow: 0 0 25px #00f0ff;
            transform: scale(1.08);
        }
        .pause-btn:active {
            transform: scale(0.95);
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 5, 10, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay-screen h1 {
            font-size: 44px;
            margin-bottom: 8px;
            letter-spacing: 4px;
            text-shadow: 0 0 25px #00f0ff, 0 0 50px rgba(0, 240, 255, 0.6);
            color: #fff;
            text-align: center;
            font-weight: 900;
        }
        .overlay-screen h2 {
            font-size: 38px;
            margin-bottom: 12px;
            letter-spacing: 4px;
            text-shadow: 0 0 25px #ff0055, 0 0 50px rgba(255, 0, 85, 0.6);
            color: #ff0055;
            text-align: center;
            font-weight: 900;
        }
        .overlay-screen p {
            font-size: 14px;
            margin-bottom: 30px;
            color: #a0aec0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .menu-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 14px 42px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            backdrop-filter: blur(8px);
            letter-spacing: 2px;
            border-radius: 6px;
            pointer-events: auto;
        }
        .menu-btn:hover {
            background: #00f0ff;
            color: #030408;
            box-shadow: 0 0 40px #00f0ff, inset 0 0 15px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        .menu-btn:active {
            transform: translateY(1px);
        }
        #pause-screen {
            display: none;
        }
        #gameover-screen {
            display: none;
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #718096;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div class="ui-layer" id="hud-layer">
            <div class="hud-left">
                <div>分數 / SCORE: <span id="scoreVal">0</span></div>
                <div>速度倍率 / SPEED: <span id="speedVal">1.0</span>x</div>
            </div>
            <button class="pause-btn" id="pauseBtn" onclick="togglePause()" title="暫停">❚❚</button>
        </div>

        <div class="overlay-screen" id="start-screen">
            <h1>賽博幾何</h1>
            <p>CYBER DASH // 雙向障礙極速跑酷</p>
            <button class="menu-btn" onclick="startGame()">點擊開始遊戲</button>
            <div class="controls-hint">操作方式：點擊螢幕 / 空白鍵 / 向上鍵跳躍（可觸地/天花板，但單次不得超過 0.5 秒）</div>
        </div>

        <div class="overlay-screen" id="pause-screen">
            <h1>系統暫停</h1>
            <p>SYSTEM PAUSED</p>
            <button class="menu-btn" onclick="togglePause()">繼續遊戲</button>
            <button class="menu-btn" onclick="restartGame()">重新開始</button>
        </div>

        <div class="overlay-screen" id="gameover-screen">
            <h2>系統崩潰</h2>
            <p>最終得分 / FINAL SCORE: <span id="finalScoreVal">0</span></p>
            <button class="menu-btn" onclick="restartGame()">重新遊玩</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'START';
        let score = 0;
        let gameSpeed = 8.0;
        let baseGravity = 0.90;

        let player = {
            x: 140,
            y: 220,
            size: 38,
            vy: 0,
            gravity: baseGravity,
            jumpPower: -13.0,
            rotation: 0,
            touchTimer: 0 // 計算碰到邊界的持續時間（以影格計，以 60fps 計算 0.5 秒 = 30 影格）
        };

        let obstacles = [];
        let particles = [];
        let backgroundLines = [];
        let frameCount = 0;

        for (let i = 0; i < 15; i++) {
            backgroundLines.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 80 + 40,
                speed: Math.random() * 2 + 1
            });
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'PLAYING') {
                    jump();
                } else if (gameState === 'START') {
                    startGame();
                } else if (gameState === 'GAMEOVER') {
                    restartGame();
                }
            }
            if (e.code === 'Escape') {
                if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                    togglePause();
                }
            }
        });

        canvas.addEventListener('click', (e) => {
            if (gameState === 'PLAYING') {
                jump();
            }
        });

        function jump() {
            player.vy = player.jumpPower;
            
            for(let i = 0; i < 10; i++) {
                particles.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: '#00f0ff',
                    size: Math.random() * 3 + 2,
                    life: 25
                });
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud-layer').style.display = 'flex';
            resetValues();
            requestAnimationFrame(loop);
        }

        function restartGame() {
            gameState = 'PLAYING';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('hud-layer').style.display = 'flex';
            resetValues();
            requestAnimationFrame(loop);
        }

        function resetValues() {
            score = 0;
            gameSpeed = 8.0;
            obstacles = [];
            particles = [];
            player.y = 220;
            player.vy = 0;
            player.rotation = 0;
            player.touchTimer = 0;
            frameCount = -70;
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('pause-screen').style.display = 'flex';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('pause-screen').style.display = 'none';
                requestAnimationFrame(loop);
            }
        }

        function spawnObstacle() {
            const topBoundary = 50;
            const bottomBoundary = 450;
            const totalHeight = bottomBoundary - topBoundary;
            const obstacleWidth = 38;

            const type = Math.floor(Math.random() * 3);

            if (type === 0) {
                const h = Math.random() * 110 + 60;
                obstacles.push({
                    x: canvas.width,
                    y: bottomBoundary - h,
                    width: obstacleWidth,
                    height: h
                });
            } else if (type === 1) {
                const h = Math.random() * 110 + 60;
                obstacles.push({
                    x: canvas.width,
                    y: topBoundary,
                    width: obstacleWidth,
                    height: h
                });
            } else {
                const minGap = 160; 
                const maxTopH = totalHeight - minGap - 60;
                const topH = Math.random() * (maxTopH - 60) + 60;
                
                const gapY1 = topBoundary + topH;
                const gapY2 = gapY1 + minGap;
                const bottomH = bottomBoundary - gapY2;

                obstacles.push({
                    x: canvas.width,
                    y: topBoundary,
                    width: obstacleWidth,
                    height: topH
                });

                obstacles.push({
                    x: canvas.width,
                    y: gapY2,
                    width: obstacleWidth,
                    height: bottomH
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (gameSpeed < 13.5) {
                gameSpeed += 0.002;
            }
            score += Math.floor(gameSpeed / 4);

            document.getElementById('scoreVal').innerText = score;
            document.getElementById('speedVal').innerText = (gameSpeed / 8.0).toFixed(1);

            player.vy += player.gravity;
            player.y += player.vy;
            player.rotation += gameSpeed * 0.03;

            const topLimit = 50;
            const bottomLimit = 450 - player.size;

            // 邊界碰撞與 0.5 秒（30個影格）限制判定
            let isTouchingBoundary = false;

            if (player.y <= topLimit) {
                player.y = topLimit;
                player.vy = 0;
                isTouchingBoundary = true;
            } else if (player.y >= bottomLimit) {
                player.y = bottomLimit;
                player.vy = 0;
                isTouchingBoundary = true;
            }

            if (isTouchingBoundary) {
                player.touchTimer++;
                // 30 影格約等於 0.5 秒 (以 60fps 計)
                if (player.touchTimer > 30) {
                    triggerGameOver();
                    return;
                }
            } else {
                // 只要離開地板或天花板就重置計時器
                player.touchTimer = 0;
            }

            backgroundLines.forEach(line => {
                line.x -= line.speed * (gameSpeed * 0.3);
                if (line.x < -100) {
                    line.x = canvas.width + 50;
                    line.y = Math.random() * canvas.height;
                }
            });

            if (frameCount >= 0 && frameCount % 2 === 0) {
                particles.push({
                    x: player.x,
                    y: player.y + player.size / 2,
                    vx: -gameSpeed * 0.6,
                    vy: (Math.random() - 0.5) * 1.5,
                    color: 'rgba(0, 240, 255, 0.7)',
                    size: Math.random() * 3 + 1,
                    life: 18
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            frameCount++;
            if (frameCount >= 0) {
                let spawnInterval = Math.max(55, Math.floor(100 - gameSpeed * 2.2));
                if (frameCount % spawnInterval === 0) {
                    spawnObstacle();
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                let padding = 7;
                if (
                    player.x + padding < obstacles[i].x + obstacles[i].width - padding &&
                    player.x + player.size - padding > obstacles[i].x + padding &&
                    player.y + padding < obstacles[i].y + obstacles[i].height - padding &&
                    player.y + player.size - padding > obstacles[i].y + padding
                ) {
                    triggerGameOver();
                    return;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('hud-layer').style.display = 'none';
            document.getElementById('finalScoreVal').innerText = score;
            document.getElementById('gameover-screen').style.display = 'flex';

            for(let i = 0; i < 25; i++) {
                particles.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    color: '#ff0055',
                    size: Math.random() * 4 + 2,
                    life: 35
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#060810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 1.5;
            backgroundLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x, line.y);
                ctx.lineTo(line.x + line.length, line.y);
                ctx.stroke();
            });

            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f0ff';
            
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.lineTo(canvas.width, 50);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 450);
            ctx.lineTo(canvas.width, 450);
            ctx.stroke();
            ctx.shadowBlur = 0;

            let topGradient = ctx.createLinearGradient(0, 0, 0, 50);
            topGradient.addColorStop(0, 'rgba(0, 240, 255, 0.3)');
            topGradient.addColorStop(1, 'transparent');
            ctx.fillStyle = topGradient;
            ctx.fillRect(0, 0, canvas.width, 50);

            let bottomGradient = ctx.createLinearGradient(0, 450, 0, 500);
            bottomGradient.addColorStop(0, 'transparent');
            bottomGradient.addColorStop(1, 'rgba(0, 240, 255, 0.3)');
            ctx.fillStyle = bottomGradient;
            ctx.fillRect(0, 450, canvas.width, 50);

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate(player.rotation);

            ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#00f0ff';
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-player.size / 4, -player.size / 4, player.size / 2, player.size / 2);

            ctx.restore();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            obstacles.forEach(obs => {
                ctx.shadowBlur = 12;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            if (gameState === 'PLAYING') {
                requestAnimationFrame(loop);
            } else if (gameState === 'GAMEOVER') {
                let particleAnimationCount = 0;
                function renderDeathAnim() {
                    if (gameState === 'GAMEOVER' && particleAnimationCount < 40) {
                        particleAnimationCount++;
                        for (let i = particles.length - 1; i >= 0; i--) {
                            let p = particles[i];
                            p.x += p.vx;
                            p.y += p.vy;
                            p.life--;
                            if (p.life <= 0) particles.splice(i, 1);
                        }
                        draw();
                        requestAnimationFrame(renderDeathAnim);
                    }
                }
                renderDeathAnim();
            }
        }

        draw();
    </script>
</body>
</html>
