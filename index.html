<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2046賽博方程 - ARCADE CRT EDITION</title>
    <!-- 引入高像素感與復古點陣字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press+Start+2P', 'VT323', monospace;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            image-rendering: pixelated;
        }

        body {
            background-color: #000;
            color: #00ff00;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
            background-size: 8px 8px;
        }

        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #loader-screen.shatter {
            opacity: 0;
            pointer-events: none;
        }

        .loader-title {
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffff00;
            margin-bottom: 25px;
            text-shadow: 2px 2px #ff0000;
            text-align: center;
            padding: 0 15px;
        }

        .mc-progress-container {
            width: 280px;
            max-width: 80vw;
            height: 20px;
            background: #000;
            border: 3px solid #00ff00;
            padding: 2px;
            box-shadow: 2px 2px 0px #ff0000;
            position: relative;
        }

        .mc-progress-bar {
            height: 100%;
            width: 0%;
            background: #00ff00;
            box-shadow: inset 0 0 5px #ffff00;
            transition: width 0.1s linear;
        }

        .mc-progress-text {
            margin-top: 15px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #00ff00;
            text-shadow: 1px 1px #ff0000;
        }

        #arcade-cabinet {
            position: relative;
            width: 960px;
            height: 720px;
            max-width: 100vw;
            max-height: 100vh;
            background: #000;
            border: 8px solid #222;
            border-top: 16px solid #444;
            border-bottom: 16px solid #444;
            box-shadow: 0 0 20px #00ff00, inset 0 0 40px rgba(0,255,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .marquee {
            height: 45px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 3px dashed #00ff00;
            color: #ffff00;
            font-size: 11px;
            letter-spacing: 2px;
            text-shadow: 2px 2px #ff0000;
        }

        #game-container {
            position: relative;
            flex: 1;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #game-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.8) 50%);
            z-index: 20;
            background-size: 100% 3px;
            pointer-events: none;
        }
        
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,255,0,0) 60%, rgba(0,0,0,0.85) 100%);
            z-index: 21;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            cursor: pointer;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            justify-content: space-between;
            padding: 15px;
            z-index: 25;
        }
        .hud-left {
            font-size: 12px;
            color: #00ff00;
            text-shadow: 2px 2px #ff0000;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hud-left span {
            color: #ffff00;
        }
        .hud-right {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .hud-btn {
            background: #000;
            border: 3px solid #00ff00;
            color: #00ff00;
            width: 40px;
            height: 40px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hud-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
        .hud-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .hud-btn.muted {
            border-color: #ff0000;
            color: #ff0000;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 20px;
            text-align: center;
        }
        .overlay-screen h1 {
            font-size: 24px;
            margin-bottom: 15px;
            letter-spacing: 3px;
            color: #ffff00;
            text-shadow: 3px 3px #ff0000, 5px 5px #0000ff;
        }
        .overlay-screen h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ff0000;
            text-shadow: 3px 3px #00ff00;
        }
        .overlay-screen p {
            font-size: 11px;
            margin-bottom: 20px;
            color: #00ff00;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .menu-btn {
            background: #000;
            border: 4px solid #00ff00;
            color: #00ff00;
            padding: 12px 24px;
            font-size: 11px;
            cursor: pointer;
            margin: 8px;
            box-shadow: 4px 4px 0px #ff0000;
            letter-spacing: 2px;
            pointer-events: auto;
        }
        .menu-btn:hover, .menu-btn:active {
            background: #00ff00;
            color: #000;
            box-shadow: 2px 2px 0px #ffff00;
            transform: translate(2px, 2px);
        }

        #pause-screen, #gameover-screen {
            display: none;
        }

        .controls-hint {
            position: absolute;
            bottom: 15px;
            font-size: 8px;
            color: #00aa00;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 10px;
            line-height: 1.5;
        }

        .mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: none;
            justify-content: space-between;
            padding: 0 15px 15px 15px;
            z-index: 26;
            pointer-events: none;
        }
        .mob-btn {
            pointer-events: auto;
            background: #000;
            border: 3px solid #00ff00;
            color: #00ff00;
            width: 110px;
            height: 50px;
            font-size: 10px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0px #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mob-btn:active, .mob-btn.active {
            background: #00ff00;
            color: #000;
            box-shadow: none;
            transform: translate(3px, 3px);
        }
        #mob-dash-btn.active {
            border-color: #ffff00;
            color: #ffff00;
            background: #330;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="loader-title">&gt;&gt; 2046 賽博方程 加載中 &lt;&lt;</div>
        <div class="mc-progress-container">
            <div class="mc-progress-bar" id="mcBar"></div>
        </div>
        <div class="mc-progress-text" id="mcText">SYSTEM LOADING 0%</div>
    </div>

    <div id="arcade-cabinet">
        <div class="marquee">
            <span>CREDITS : <span id="creditVal">01</span></span>
            <span>★ 2046 ARCADE SYSTEM ★</span>
            <span>FR-CORP</span>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            
            <div class="ui-layer" id="hud-layer">
                <div class="hud-left">
                    <div>SCORE : <span id="scoreVal">000000</span></div>
                </div>
                <div class="hud-right">
                    <button class="hud-btn" id="audioToggleBtn" onclick="toggleAudio()" title="音效開關">
                        <svg id="audioIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    </button>
                    <button class="hud-btn" id="pauseBtn" onclick="togglePause()" title="暫停">
                        <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>
            </div>

            <div class="mobile-controls" id="mobileControls">
                <button class="mob-btn" id="mob-jump-btn">跳躍</button>
                <button class="mob-btn" id="mob-dash-btn">平移(長按)</button>
            </div>

            <div class="overlay-screen" id="start-screen">
                <h1>賽博方程</h1>
                <p>FR科技公司製作 網頁版v1.1.2</p>
                <button class="menu-btn" onclick="startGame()">[ 點擊開始遊戲 ]</button>
                <div class="controls-hint">電腦：空白鍵/點擊跳躍，長按0.2秒平移 | 手機：使用下方專屬控制按鈕</div>
            </div>

            <div class="overlay-screen" id="pause-screen">
                <h2>SYSTEM PAUSED</h2>
                <button class="menu-btn" onclick="togglePause()">RESUME</button>
                <button class="menu-btn" onclick="confirmRestart()">QUIT</button>
            </div>

            <div class="overlay-screen" id="gameover-screen">
                <h2>GAME OVER</h2>
                <p>FINAL SCORE: <span id="finalScoreVal">000000</span></p>
                <button class="menu-btn" onclick="returnToStartScreen()">INSERT COIN</button>
            </div>
        </div>
    </div>

    <script>
        let loadProgress = 0;
        const barElem = document.getElementById('mcBar');
        const textElem = document.getElementById('mcText');
        const loaderScreen = document.getElementById('loader-screen');
        const mobileControls = document.getElementById('mobileControls');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

        let audioCtx = null;
        let bgmInterval = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            initAudio();
            isMuted = !isMuted;
            const btn = document.getElementById('audioToggleBtn');
            const iconSvg = document.getElementById('audioIcon');
            if (isMuted) {
                iconSvg.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
                btn.classList.add('muted');
            } else {
                iconSvg.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
                btn.classList.remove('muted');
            }
        }

        function playJumpSound() {
            if (!audioCtx || isMuted) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        function playDashSound() {
            if (!audioCtx || isMuted) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(450, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playCrashSound() {
            if (!audioCtx || isMuted) return;
            try {
                let node = audioCtx.createBufferSource();
                let buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                node.buffer = buffer;
                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 500;
                node.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                node.start();
            } catch(e) {}
        }

        function startBGM() {
            stopBGM();
            let notes = [220, 246.94, 261.63, 293.66, 329.63, 293.66, 261.63, 246.94];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!audioCtx || gameState !== 'PLAYING' || isMuted) return;
                try {
                    let t = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(notes[step % notes.length], t);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + 0.12);
                    step++;
                } catch(e) {}
            }, 130);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        let loadInterval = setInterval(() => {
            loadProgress += Math.floor(Math.random() * 15) + 10;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                barElem.style.width = '100%';
                textElem.innerText = 'SYSTEM READY 100%';
                setTimeout(() => {
                    loaderScreen.classList.add('shatter');
                    setTimeout(() => loaderScreen.remove(), 400);
                }, 200);
            } else {
                barElem.style.width = loadProgress + '%';
                textElem.innerText = `SYSTEM LOADING ${loadProgress}%`;
            }
        }, 80);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'START';
        let score = 0;
        let gameSpeed = isMobile ? 8.5 : 7.5;
        let baseGravity = isMobile ? 0.8 : 0.7;
        let jumpPower = isMobile ? -12.5 : -11.5;

        let player = {
            x: 150,
            baseX: 150,
            y: 270,
            size: 40,
            vy: 0,
            gravity: baseGravity,
            jumpPower: jumpPower,
            rotation: 0,
            targetRotation: 0,
            floorTimer: 0,
            ceilingTimer: 0,
            isDash: false
        };

        let pressTimer = null;
        let isHolding = false;
        let dashTimer = null;

        let obstacles = [];
        let particles = [];
        let backgroundGrid = [];
        let frameCount = 0;
        let lastTime = performance.now();

        for (let i = 0; i < 15; i++) {
            backgroundGrid.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING') {
                    if (!isHolding) {
                        isHolding = true;
                        jump();
                        pressTimer = setTimeout(() => {
                            if (isHolding) triggerDashState();
                        }, 200);
                    }
                } else if (gameState === 'START') {
                    startGame();
                }
            }
            if (e.code === 'Escape' && (gameState === 'PLAYING' || gameState === 'PAUSED')) {
                togglePause();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleRelease();
        });

        canvas.addEventListener('mousedown', () => {
            initAudio();
            if (!isMobile && gameState === 'PLAYING') {
                if (!isHolding) {
                    isHolding = true;
                    jump();
                    pressTimer = setTimeout(() => {
                        if (isHolding) triggerDashState();
                    }, 200);
                }
            } else if (!isMobile && gameState === 'START') {
                startGame();
            }
        });

        window.addEventListener('mouseup', () => {
            if (!isMobile) handleRelease();
        });

        const mobJumpBtn = document.getElementById('mob-jump-btn');
        const mobDashBtn = document.getElementById('mob-dash-btn');

        if (mobJumpBtn) {
            mobJumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING') jump();
            }, { passive: false });
            mobJumpBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING') jump();
            });
        }

        if (mobDashBtn) {
            const startDash = (e) => {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING' && !player.isDash) {
                    mobDashBtn.classList.add('active');
                    triggerDashState();
                }
            };
            const endDash = (e) => {
                e.preventDefault();
                mobDashBtn.classList.remove('active');
                if (player.isDash) endDashState();
            };
            mobDashBtn.addEventListener('touchstart', startDash, { passive: false });
            mobDashBtn.addEventListener('touchend', endDash);
            mobDashBtn.addEventListener('touchcancel', endDash);
            mobDashBtn.addEventListener('mousedown', startDash);
            mobDashBtn.addEventListener('mouseup', endDash);
            mobDashBtn.addEventListener('mouseleave', endDash);
        }

        function triggerDashState() {
            player.isDash = true;
            playDashSound();
            if (dashTimer) clearTimeout(dashTimer);
            dashTimer = setTimeout(() => {
                if (mobDashBtn) mobDashBtn.classList.remove('active');
                endDashState();
            }, 2000);
        }

        function endDashState() {
            player.isDash = false;
            if (dashTimer) {
                clearTimeout(dashTimer);
                dashTimer = null;
            }
        }

        function handleRelease() {
            isHolding = false;
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            if (!isMobile && player.isDash) endDashState();
        }

        function jump() {
            if (player.isDash) return;
            player.vy = player.jumpPower;
            player.targetRotation -= Math.PI * 2;
            playJumpSound();
            for(let i = 0; i < 5; i++) {
                particles.push({
                    x: player.x,
                    y: player.y + player.size/2,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    color: '#00ff00',
                    size: Math.random() * 3 + 2,
                    life: 12
                });
            }
        }

        function startGame() {
            initAudio();
            gameState = 'PLAYING';
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('hud-layer').style.display = 'flex';
            
            if (isMobile || window.innerWidth <= 800) {
                mobileControls.style.display = 'flex';
            }

            resetValues();
            startBGM();
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        function confirmRestart() {
            returnToStartScreen();
        }

        function returnToStartScreen() {
            gameState = 'START';
            stopBGM();
            handleRelease();
            if (dashTimer) { clearTimeout(dashTimer); dashTimer = null; }
            if (mobDashBtn) mobDashBtn.classList.remove('active');
            document.getElementById('hud-layer').style.display = 'none';
            mobileControls.style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            resetValues();
            draw();
        }

        function resetValues() {
            score = 0;
            gameSpeed = isMobile ? 8.5 : 7.5;
            obstacles = [];
            particles = [];
            player.x = 150;
            player.y = 270;
            player.vy = 0;
            player.rotation = 0;
            player.targetRotation = 0;
            player.floorTimer = 0;
            player.ceilingTimer = 0;
            player.isDash = false;
            frameCount = -60;
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                stopBGM();
                document.getElementById('pause-screen').style.display = 'flex';
                handleRelease();
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                startBGM();
                document.getElementById('pause-screen').style.display = 'none';
                lastTime = performance.now();
                requestAnimationFrame(loop);
            }
        }

        function spawnObstacle() {
            const topB = 60;
            const botB = 480;
            const totalH = botB - topB;
            const width = 40;
            const type = Math.floor(Math.random() * 3);

            if (type === 0) {
                let h = Math.random() * 120 + 60;
                obstacles.push({ x: canvas.width, y: botB - h, width, height: h });
            } else if (type === 1) {
                let h = Math.random() * 120 + 60;
                obstacles.push({ x: canvas.width, y: topB, width, height: h });
            } else {
                let minGap = 180;
                let topH = Math.random() * (totalH - minGap - 100) + 50;
                let gapY2 = topB + topH + minGap;
                obstacles.push({ x: canvas.width, y: topB, width, height: topH });
                obstacles.push({ x: canvas.width, y: gapY2, width, height: botB - gapY2 });
            }
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;
            let timeScale = dt / (1000 / 60);
            if (timeScale > 2) timeScale = 2;

            score += Math.floor(gameSpeed / 2);
            document.getElementById('scoreVal').innerText = String(score).padStart(6, '0');

            const botLimit = 480 - player.size;
            const topLimit = 60;

            if (player.isDash) {
                player.vy = 0;
            } else {
                player.vy += player.gravity * timeScale;
                player.y += player.vy * timeScale;
            }

            let targetX = player.isDash ? player.baseX + 120 : player.baseX;
            player.x += (targetX - player.x) * (0.4 * timeScale);
            player.rotation += (player.targetRotation - player.rotation) * (0.2 * timeScale);

            if (player.y <= topLimit) {
                player.y = topLimit; player.vy = 0;
                player.ceilingTimer += timeScale;
                if (player.ceilingTimer > 25) { triggerGameOver(); return; }
            } else { player.ceilingTimer = 0; }

            if (player.y >= botLimit) {
                player.y = botLimit; player.vy = 0;
                player.floorTimer += timeScale;
                if (player.floorTimer > 25) { triggerGameOver(); return; }
            } else { player.floorTimer = 0; }

            backgroundGrid.forEach(dot => {
                dot.x -= dot.speed * gameSpeed * 0.2 * timeScale;
                if (dot.x < 0) dot.x = canvas.width;
            });

            frameCount += timeScale;
            if (frameCount >= 0 && Math.floor(frameCount) % 90 < timeScale) {
                let last = obstacles[obstacles.length - 1];
                if (!last || last.x < canvas.width - 220) spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed * timeScale;
                let pad = 6;
                if (
                    player.x + pad < obstacles[i].x + obstacles[i].width - pad &&
                    player.x + player.size - pad > obstacles[i].x + pad &&
                    player.y + pad < obstacles[i].y + obstacles[i].height - pad &&
                    player.y + player.size - pad > obstacles[i].y + pad
                ) {
                    triggerGameOver();
                    return;
                }
                if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            stopBGM();
            playCrashSound();
            handleRelease();
            if (dashTimer) { clearTimeout(dashTimer); dashTimer = null; }
            if (mobDashBtn) mobDashBtn.classList.remove('active');
            document.getElementById('hud-layer').style.display = 'none';
            mobileControls.style.display = 'none';
            document.getElementById('finalScoreVal').innerText = String(score).padStart(6, '0');
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#003300';
            backgroundGrid.forEach(dot => {
                ctx.fillRect(dot.x, dot.y, 2, 2);
            });

            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 60); ctx.lineTo(canvas.width, 60);
            ctx.moveTo(0, 480); ctx.lineTo(canvas.width, 480);
            ctx.stroke();

            ctx.save();
            ctx.translate(player.x + player.size/2, player.y + player.size/2);
            ctx.rotate(player.rotation);
            ctx.fillStyle = player.isDash ? '#ffff00' : '#00ff00';
            ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
            ctx.fillStyle = '#000000';
            ctx.fillRect(-player.size/4, -player.size/4, player.size/2, player.size/2);
            ctx.restore();

            ctx.fillStyle = '#ff0000';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });
        }

        function loop(timestamp) {
            let dt = timestamp - lastTime;
            if (!dt || dt > 200) dt = 16.67;
            lastTime = timestamp;
            update(dt);
            draw();
            if (gameState === 'PLAYING') {
                requestAnimationFrame(loop);
            }
        }

        draw();
    </script>
</body>
</html>
