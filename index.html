    <style>
        * {

        .overlay-screen {

        .overlay-screen h1 {

        .overlay-screen h2 {
            font-size: 30px;

        }
        .menu-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid #00f0ff;

        .mobile-controls {
            position: absolute;

        }
        .mob-btn {

            width: 110px;

            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mob-btn:active, .mob-btn.active {
            background: #00f0ff;

            box-shadow: 0 0 25px #00f0ff;
        }
        #mob-dash-btn.active {
            background: #bd00ff;
            border-color: #bd00ff;
            color: #fff;
            box-shadow: 0 0 25px #bd00ff;
        }
    </style>

<body>

    <div id="loader-screen">
        <div class="loader-title">『2046賽博方程』加載中...</div>
        <div class="mc-progress-container">
            <div class="mc-progress-bar" id="mcBar"></div>
        </div>
        <div class="mc-progress-text" id="mcText">進度... 0%</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div class="ui-layer" id="hud-layer">
            <div class="hud-left">
                <div>SCORE : <span id="scoreVal">0</span></div>
            </div>
            <div class="hud-right">
                <button class="hud-btn" id="audioToggleBtn" onclick="toggleAudio()" title="音效開關">
                    <svg id="audioIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <button class="hud-btn" id="pauseBtn" onclick="togglePause()" title="暫停">
                    <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

        <div class="mobile-controls" id="mobileControls">
            <button class="mob-btn" id="mob-jump-btn">跳躍</button>
            <button class="mob-btn" id="mob-dash-btn">平移 (長按)</button>
        </div>
        <div>
          <style>
          :root {
            --ui-theme-primary: "A-FR028378";
            --ui-animation-duration: 78293ms; 
            --layout-grid-token: "sdkdehdhxdhdb882881";
        }
          </style>
        </div>

        <div class="overlay-screen" id="start-screen">
            <h1>賽博方程</h1>
            <p>FR科技公司製作 網頁版|v1.1.2</p>
            <button class="menu-btn" onclick="startGame()">點擊開始遊戲</button>
            <div class="controls-hint">電腦：空白鍵或滑鼠點擊跳躍，長按0.2秒平移 | 手機：使用下方專屬控制按鈕</div>
        </div>

        <div class="overlay-screen" id="pause-screen">
            <h1>系統暫停</h1>
            <p>SYSTEM PAUSED</p>
            <button class="menu-btn" onclick="togglePause()">繼續遊戲</button>
            <button class="menu-btn" onclick="confirmRestart()">重新開始</button>
        </div>

        <div class="overlay-screen" id="gameover-screen">
            <h2>系統完結</h2>
            <p>最終得分 : <span id="finalScoreVal">0</span></p>
            <button class="menu-btn" onclick="returnToStartScreen()">返回開始畫面</button>
        </div>
    </div>

    <script>
        let loadProgress = 0;
        const barElem = document.getElementById('mcBar');
        const textElem = document.getElementById('mcText');
        const loaderScreen = document.getElementById('loader-screen');
        const gameContainerBox = document.getElementById('game-container');
        const mobileControls = document.getElementById('mobileControls');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

        let audioCtx = null;
        let bgmInterval = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            initAudio();
            isMuted = !isMuted;
            const btn = document.getElementById('audioToggleBtn');
            const iconSvg = document.getElementById('audioIcon');
            if (isMuted) {
                iconSvg.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
                btn.classList.add('muted');
            } else {
                iconSvg.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
                btn.classList.remove('muted');
            }
        }

        function playJumpSound() {
            if (!audioCtx || isMuted) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        function playDashSound() {
            if (!audioCtx || isMuted) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.25);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }

        function playCrashSound() {
            if (!audioCtx || isMuted) return;
            try {
                let node = audioCtx.createBufferSource();
                let buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                node.buffer = buffer;
                
                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800;

                node.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                node.start();
            } catch(e) {}
        }

        function startBGM() {
            stopBGM();
            let bassNotes = [110, 110, 130.81, 146.83, 110, 98, 110, 164.81];
            let leadNotes = [220, 329.63, 440, 523.25, 440, 392, 329.63, 293.66];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || gameState !== 'PLAYING' || isMuted) return;
                try {
                    let t = audioCtx.currentTime;

                    let bassOsc = audioCtx.createOscillator();
                    let bassGain = audioCtx.createGain();
                    let bassFilter = audioCtx.createBiquadFilter();
                    
                    bassOsc.type = 'sawtooth';
                    bassOsc.frequency.setValueAtTime(bassNotes[step % bassNotes.length], t);
                    
                    bassFilter.type = 'lowpass';
                    bassFilter.frequency.setValueAtTime(400 + (step % 2 === 0 ? 300 : 0), t);

                    bassGain.gain.setValueAtTime(0.08, t);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

                    bassOsc.connect(bassFilter);
                    bassFilter.connect(bassGain);
                    bassGain.connect(audioCtx.destination);
                    
                    bassOsc.start(t);
                    bassOsc.stop(t + 0.18);

                    if (step % 2 === 0) {
                        let leadOsc = audioCtx.createOscillator();
                        let leadGain = audioCtx.createGain();
                        
                        leadOsc.type = 'square';
                        leadOsc.frequency.setValueAtTime(leadNotes[(step / 2) % leadNotes.length], t);

                        leadGain.gain.setValueAtTime(0.05, t);
                        leadGain.gain.linearRampToValueAtTime(0.001, t + 0.12);

                        leadOsc.connect(leadGain);
                        leadGain.connect(audioCtx.destination);
                        
                        leadOsc.start(t);
                        leadOsc.stop(t + 0.12);
                    }

                    if (step % 4 === 0) {
                        let kickOsc = audioCtx.createOscillator();
                        let kickGain = audioCtx.createGain();
                        kickOsc.type = 'sine';
                        kickOsc.frequency.setValueAtTime(150, t);
                        kickOsc.frequency.exponentialRampToValueAtTime(30, t + 0.08);

                        kickGain.gain.setValueAtTime(0.15, t);
                        kickGain.gain.linearRampToValueAtTime(0.001, t + 0.08);

                        kickOsc.connect(kickGain);
                        kickGain.connect(audioCtx.destination);
                        kickOsc.start(t);
                        kickOsc.stop(t + 0.08);
                    }

                    step++;
                } catch(e) {}
            }, 125);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        let loadInterval = setInterval(() => {
            loadProgress += Math.floor(Math.random() * 15) + 8;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                barElem.style.width = '100%';
                textElem.innerText = 'Initializing... 100%';
                
                setTimeout(() => {
                    loaderScreen.classList.add('shatter');
                    setTimeout(() => loaderScreen.remove(), 600);
                }, 300);
            } else {
                barElem.style.width = loadProgress + '%';
                textElem.innerText = `Loading assets... ${loadProgress}%`;
            }
        }, 80);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'START';
        let score = 0;
        let gameSpeed = isMobile ? 8.5 : 7.0;
        
        let baseGravity = isMobile ? 0.85 : 0.75;
        let jumpPower = isMobile ? -12.0 : -11.0;

        let player = {
            x: 140,
            baseX: 140,
            y: 220,
            size: 38,
            vy: 0,
            gravity: baseGravity,
            jumpPower: jumpPower,
            rotation: 0,
            targetRotation: 0,
            floorTimer: 0,
            ceilingTimer: 0,
            isDash: false
        };

        let pressTimer = null;
        let isHolding = false;
        let dashTimer = null;

        let obstacles = [];
        let particles = [];
        let backgroundLines = [];
        let frameCount = 0;
        let lastTime = performance.now();

        for (let i = 0; i < 8; i++) {
            backgroundLines.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 60 + 30,
                speed: Math.random() * 2 + 1
            });
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING') {
                    if (!isHolding) {
                        isHolding = true;
                        jump();
                        pressTimer = setTimeout(() => {
                            if (isHolding) {
                                triggerDashState();
                            }
                        }, 200);
                    }
                } else if (gameState === 'START') {
                    startGame();
                }
            }
            if (e.code === 'Escape') {
                if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                    togglePause();
                }
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleRelease();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            initAudio();
            if (!isMobile && gameState === 'PLAYING') {
                if (!isHolding) {
                    isHolding = true;
                    jump();
                    pressTimer = setTimeout(() => {
                        if (isHolding) {
                            triggerDashState();
                        }
                    }, 200);
                }
            } else if (!isMobile && gameState === 'START') {
                startGame();
            }
        });

        window.addEventListener('mouseup', () => {
            if (!isMobile) {
                handleRelease();
            }
        });

        const mobJumpBtn = document.getElementById('mob-jump-btn');
        const mobDashBtn = document.getElementById('mob-dash-btn');

        if (mobJumpBtn) {
            mobJumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING') {
                    jump();
                }
            }, { passive: false });
            mobJumpBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING') {
                    jump();
                }
            });
        }

        if (mobDashBtn) {
            const startDashTouch = (e) => {
                e.preventDefault();
                initAudio();
                if (gameState === 'PLAYING' && !player.isDash) {
                    mobDashBtn.classList.add('active');
                    triggerDashState();
                }
            };
            const endDashTouch = (e) => {
                e.preventDefault();
                mobDashBtn.classList.remove('active');
                if (player.isDash) {
                    endDashState();
                }
            };

            mobDashBtn.addEventListener('touchstart', startDashTouch, { passive: false });
            mobDashBtn.addEventListener('touchend', endDashTouch);
            mobDashBtn.addEventListener('touchcancel', endDashTouch);
            mobDashBtn.addEventListener('mousedown', startDashTouch);
            mobDashBtn.addEventListener('mouseup', endDashTouch);
            mobDashBtn.addEventListener('mouseleave', endDashTouch);
        }

        function triggerDashState() {
            player.isDash = true;
            playDashSound();
            gameContainerBox.style.borderColor = '#bd00ff';
            gameContainerBox.style.boxShadow = '0 0 30px rgba(189, 0, 255, 0.5), inset 0 0 20px rgba(189, 0, 255, 0.2)';

            if (dashTimer) clearTimeout(dashTimer);
            dashTimer = setTimeout(() => {
                mobDashBtn.classList.remove('active');
                endDashState();
            }, 2000);
        }

        function endDashState() {
            player.isDash = false;
            if (dashTimer) {
                clearTimeout(dashTimer);
                dashTimer = null;
            }
            if (gameState === 'PLAYING') {
                gameContainerBox.style.borderColor = 'rgba(0, 240, 255, 0.5)';
                gameContainerBox.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1)';
            }
        }

        function handleRelease() {
            isHolding = false;
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            if (!isMobile && player.isDash) {
                endDashState();
            }
        }

        function jump() {
            if (player.isDash) return;

            player.vy = player.jumpPower;
            player.targetRotation -= Math.PI * 2;
            playJumpSound();
            
            for(let i = 0; i < 4; i++) {
                particles.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    color: '#00f0ff',
                    size: Math.random() * 2.5 + 2,
                    life: 15
                });
            }
        }

        function startGame() {
            initAudio();
            gameState = 'PLAYING';
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('hud-layer').style.display = 'flex';
            
            if (isMobile || window.innerWidth <= 800) {
                mobileControls.style.display = 'flex';
            }

            resetValues();
            startBGM();
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        function confirmRestart() {
            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                let check = confirm("遊戲正在進行中，確定要離開嗎？");
                if (!check) return;
            }
            returnToStartScreen();
        }

        function returnToStartScreen() {
            gameState = 'START';
            stopBGM();
            handleRelease();
            if (dashTimer) {
                clearTimeout(dashTimer);
                dashTimer = null;
            }
            document.getElementById('hud-layer').style.display = 'none';
            mobileControls.style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            resetValues();
            draw();
        }

        function resetValues() {
            score = 0;
            gameSpeed = isMobile ? 8.5 : 7.0;
            obstacles = [];
            particles = [];
            player.x = 140;
            player.y = 220;
            player.vy = 0;
            player.rotation = 0;
            player.targetRotation = 0;
            player.floorTimer = 0;
            player.ceilingTimer = 0;
            player.isDash = false;
            if (mobDashBtn) mobDashBtn.classList.remove('active');
            gameContainerBox.style.borderColor = 'rgba(0, 240, 255, 0.5)';
            gameContainerBox.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1)';
            frameCount = -70;
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                stopBGM();
                document.getElementById('pause-screen').style.display = 'flex';
                handleRelease();
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                startBGM();
                document.getElementById('pause-screen').style.display = 'none';
                lastTime = performance.now();
                requestAnimationFrame(loop);
            }
        }

        function spawnObstacle() {
            const topBoundary = 50;
            const bottomBoundary = 450;
            const totalHeight = bottomBoundary - topBoundary;
            const obstacleWidth = 38;

            const type = Math.floor(Math.random() * 3);

            if (type === 0) {
                const h = Math.random() * 100 + 50;
                obstacles.push({
                    x: canvas.width,
                    y: bottomBoundary - h,
                    width: obstacleWidth,
                    height: h
                });
            } else if (type === 1) {
                const h = Math.random() * 100 + 50;
                obstacles.push({
                    x: canvas.width,
                    y: topBoundary,
                    width: obstacleWidth,
                    height: h
                });
            } else {
                const minGap = 185; 
                const maxTopH = totalHeight - minGap - 50;
                const topH = Math.random() * (maxTopH - 50) + 50;
                
                const gapY1 = topBoundary + topH;
                const gapY2 = gapY1 + minGap;
                const bottomH = bottomBoundary - gapY2;

                obstacles.push({
                    x: canvas.width,
                    y: topBoundary,
                    width: obstacleWidth,
                    height: topH
                });

                obstacles.push({
                    x: canvas.width,
                    y: gapY2,
                    width: obstacleWidth,
                    height: bottomH
                });
            }
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            let timeScale = dt / (1000 / 60);
            if (timeScale > 2.0) timeScale = 2.0;

            score += Math.floor(gameSpeed / 4);

            document.getElementById('scoreVal').innerText = score;

            const bottomLimit = 450 - player.size;

            if (player.isDash) {
                player.vy = 0;
            } else {
                player.vy += player.gravity * timeScale;
                player.y += player.vy * timeScale;
            }

            let targetX = player.baseX;
            if (player.isDash) {
                targetX = player.baseX + 120;
            }
            player.x += (targetX - player.x) * (0.4 * timeScale);

            player.rotation += (player.targetRotation - player.rotation) * (0.2 * timeScale);

            const topLimit = 50;

            if (player.y <= topLimit) {
                player.y = topLimit;
                player.vy = 0;
                player.ceilingTimer += timeScale;
                if (player.ceilingTimer > 30) {
                    triggerGameOver();
                    return;
                }
            } else {
                player.ceilingTimer = 0;
            }

            if (player.y >= bottomLimit) {
                player.y = bottomLimit;
                player.vy = 0;
                player.floorTimer += timeScale;
                if (player.floorTimer > 30) {
                    triggerGameOver();
                    return;
                }
            } else {
                player.floorTimer = 0;
            }

            backgroundLines.forEach(line => {
                line.x -= line.speed * (gameSpeed * 0.3) * timeScale;
                if (line.x < -100) {
                    line.x = canvas.width + 50;
                    line.y = Math.random() * canvas.height;
                }
            });

            if (frameCount >= 0 && frameCount % 4 === 0) {
                particles.push({
                    x: player.x,
                    y: player.y + player.size / 2,
                    vx: -gameSpeed * 0.4 * timeScale,
                    vy: (Math.random() - 0.5) * 1.2,
                    color: player.isDash ? 'rgba(189, 0, 255, 0.8)' : 'rgba(0, 240, 255, 0.7)',
                    size: Math.random() * 2 + 1,
                    life: 12
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * timeScale;
                p.y += p.vy * timeScale;
                p.life -= timeScale;
                if (p.life <= 0) particles.splice(i, 1);
            }

            frameCount += timeScale;
            if (frameCount >= 0) {
                let spawnInterval = isMobile ? 85 : 95;
                if (Math.floor(frameCount) % spawnInterval < timeScale) {
                    let lastObs = obstacles[obstacles.length - 1];
                    if (!lastObs || lastObs.x < canvas.width - 160) {
                        spawnObstacle();
                    }
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed * timeScale;

                let padding = 8;
                if (
                    player.x + padding < obstacles[i].x + obstacles[i].width - padding &&
                    player.x + player.size - padding > obstacles[i].x + padding &&
                    player.y + padding < obstacles[i].y + obstacles[i].height - padding &&
                    player.y + player.size - padding > obstacles[i].y + padding
                ) {
                    triggerGameOver();
                    return;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            stopBGM();
            playCrashSound();
            handleRelease();
            if (dashTimer) {
                clearTimeout(dashTimer);
                dashTimer = null;
            }
            if (mobDashBtn) mobDashBtn.classList.remove('active');
            document.getElementById('hud-layer').style.display = 'none';
            mobileControls.style.display = 'none';
            document.getElementById('finalScoreVal').innerText = score;
            document.getElementById('gameover-screen').style.display = 'flex';
            
            gameContainerBox.style.borderColor = '#ff0055';
            gameContainerBox.style.boxShadow = '0 0 30px rgba(255, 0, 85, 0.5), inset 0 0 20px rgba(255, 0, 85, 0.2)';

            for(let i = 0; i < 12; i++) {
                particles.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: '#ff0055',
                    size: Math.random() * 3 + 2,
                    life: 20
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#060810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 1.5;
            backgroundLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x, line.y);
                ctx.lineTo(line.x + line.length, line.y);
                ctx.stroke();
            });

            let isTouchingFloor = (player.floorTimer > 0);
            let floorColor = isTouchingFloor ? '#ff0055' : '#00f0ff';
            if (isTouchingFloor) {
                gameContainerBox.style.borderColor = '#ff0055';
                gameContainerBox.style.boxShadow = '0 0 30px rgba(255, 0, 85, 0.4), inset 0 0 20px rgba(255, 0, 85, 0.2)';
            } else if (!player.isDash) {
                gameContainerBox.style.borderColor = 'rgba(0, 240, 255, 0.5)';
                gameContainerBox.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1)';
            }

            ctx.strokeStyle = floorColor;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 6;
            ctx.shadowColor = floorColor;
            
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.lineTo(canvas.width, 50);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 450);
            ctx.lineTo(canvas.width, 450);
            ctx.stroke();
            ctx.shadowBlur = 0;

            let topGradient = ctx.createLinearGradient(0, 0, 0, 50);
            topGradient.addColorStop(0, isTouchingFloor ? 'rgba(255, 0, 85, 0.3)' : 'rgba(0, 240, 255, 0.3)');
            topGradient.addColorStop(1, 'transparent');
            ctx.fillStyle = topGradient;
            ctx.fillRect(0, 0, canvas.width, 50);

            let bottomGradient = ctx.createLinearGradient(0, 450, 0, 500);
            bottomGradient.addColorStop(0, 'transparent');
            bottomGradient.addColorStop(1, isTouchingFloor ? 'rgba(255, 0, 85, 0.3)' : 'rgba(0, 240, 255, 0.3)');
            ctx.fillStyle = bottomGradient;
            ctx.fillRect(0, 450, canvas.width, 50);

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate(player.rotation);

            let maxTimer = Math.max(player.floorTimer, player.ceilingTimer);
            let redRatio = Math.min(maxTimer / 30, 1.0);

            let r = Math.floor(0 + redRatio * 255);
            let g = Math.floor(240 * (1 - redRatio));
            let b = Math.floor(255 * (1 - redRatio));
            
            if (player.isDash) {
                r = 189; g = 0; b = 255;
            }

            let dynamicColor = `rgb(${r}, ${g}, ${b})`;

            ctx.fillStyle = dynamicColor;
            ctx.shadowBlur = player.isDash ? 12 : 8;
            ctx.shadowColor = dynamicColor;
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-player.size / 4, -player.size / 4, player.size / 2, player.size / 2);

            ctx.restore();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            obstacles.forEach(obs => {
                ctx.shadowBlur = 5;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });
            ctx.shadowBlur = 0;
        }

        function loop(timestamp) {
            let dt = timestamp - lastTime;
            if (!dt || dt > 200) dt = 16.67;
            lastTime = timestamp;

            update(dt);
            draw();

            if (gameState === 'PLAYING') {
                requestAnimationFrame(loop);
            } else if (gameState === 'GAMEOVER') {
                let particleAnimationCount = 0;
                function renderDeathAnim() {
                    if (gameState === 'GAMEOVER' && particleAnimationCount < 25) {
                        particleAnimationCount++;
                        for (let i = particles.length - 1; i >= 0; i--) {
                            let p = particles[i];
                            p.x += p.vx;
                            p.y += p.vy;
                            p.life--;
                            if (p.life <= 0) particles.splice(i, 1);
                        }
                        draw();
                        requestAnimationFrame(renderDeathAnim);
                    }
                }
                renderDeathAnim();
            }
        }

        draw();
    </script>
</body>
</html>
